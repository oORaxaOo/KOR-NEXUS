name: KOR-NEXUS Quality and Package Gates

on:
  push:
    branches: [main, master, "transfer/**", "fix/**"]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Read-only repository access; no release, deployment, or repository-write permission.
permissions:
  contents: read

concurrency:
  group: kor-nexus-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Portable quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 (Node.js 24)

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0 (Node.js 24)
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 (Node.js 24)
        with:
          node-version: '22'

      - name: Run portable syntax, version, source, and archive gates
        run: bash scripts/ci.sh quick

      - name: Run backend unit tests
        run: python -m unittest -v core.test_server

      - name: Verify generated source archive and checksum manifest
        if: success()
        run: |
          test -s SOURCE_SHA256SUMS.txt
          sha256sum -c SOURCE_SHA256SUMS.txt
          python - <<'PY'
          import re
          import tarfile
          from pathlib import Path

          version_match = re.search(r'^pkgver=(.+)$', Path('PKGBUILD').read_text(), re.M)
          if not version_match:
              raise SystemExit('PKGBUILD does not declare pkgver')
          archive = Path(f'kor-workstation-{version_match.group(1)}.tar.gz')
          with tarfile.open(archive, 'r:gz') as stream:
              members = stream.getmembers()
              names = {member.name.removeprefix('./') for member in members}
          required = {
              'PKGBUILD', 'core/server.py', 'core/test_server.py',
              'core/github_integration.py', 'tests/test_github_integration.py',
              'web/github.html', 'web/code.html', 'web/js/github-center.js', 'GITHUB_CENTER.md',
              'tests/test_code_workbench.py',
              'web/geodata/world.geojson', 'scripts/ci.sh',
              'scripts/release-check.sh', 'scripts/test-installation.sh',
              '.github/workflows/release.yml',
          }
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f'Source archive missing required paths: {missing}')
          print(f'Archive member check passed: {len(names)} entries')
          PY

      - name: Upload verified source artifacts
        if: success()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0 (Node.js 24)
        with:
          name: kor-nexus-source-${{ github.sha }}
          path: |
            kor-workstation-*.tar.gz
            SOURCE_SHA256SUMS.txt
            PKGBUILD
          if-no-files-found: error
          retention-days: 30

  browser-and-install:
    name: Browser QA and user installation integration test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 (Node.js 24)

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0 (Node.js 24)
        with:
          python-version: '3.12'

      - name: Install Chromium for Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium

      - name: Run browser UI smoke tests with a hard timeout
        run: timeout --signal=TERM --kill-after=10s 120s python scripts/qa-preview-playwright.py

      - name: Run isolated user install/upgrade/stop/uninstall test
        run: timeout --signal=TERM --kill-after=10s 120s bash scripts/test-installation.sh

  arch-package:
    name: Native Arch Linux package build and isolated install test
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Install CI runtime and package dependencies
        run: |
          pacman -Syu --noconfirm --needed git python nodejs npm python-pyqt6 python-pyqt6-webengine
          useradd --create-home --shell /bin/bash builder
          printf 'builder ALL=(ALL:ALL) NOPASSWD: ALL\n' > /etc/sudoers.d/ci-builder
          chmod 0440 /etc/sudoers.d/ci-builder

      - name: Checkout source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 (Node.js 24)
        with:
          path: project

      - name: Build and verify package as an unprivileged user
        working-directory: project
        run: |
          set -euo pipefail
          chown -R builder:builder .
          su builder -s /bin/bash -c 'python scripts/create-source-archive.py'
          su builder -s /bin/bash -c 'bash scripts/release-check.sh quick'
          find . -maxdepth 1 -type f -name '*.pkg.tar.*' -delete
          su builder -s /bin/bash -c 'makepkg --cleanbuild --force --noconfirm'
          mapfile -t PACKAGES < <(find . -maxdepth 1 -type f -name '*.pkg.tar.*' -printf '%f\n' | sort)
          test "${#PACKAGES[@]}" -eq 1 || { echo 'Expected exactly one package artifact' >&2; exit 1; }
          PACKAGE="${PACKAGES[0]}"
          test -s "$PACKAGE"
          su builder -s /bin/bash -c "python scripts/verify-built-package.py '$PACKAGE'"
          pacman -Qp --info "$PACKAGE"
          pacman -Qp --list "$PACKAGE"

      - name: Install-test package in disposable Arch container
        working-directory: project
        run: |
          set -euo pipefail
          mapfile -t PACKAGES < <(find . -maxdepth 1 -type f -name '*.pkg.tar.*' -printf '%f\n' | sort)
          test "${#PACKAGES[@]}" -eq 1
          timeout --signal=TERM --kill-after=10s 8m bash scripts/test-built-package-installation.sh "${PACKAGES[0]}"

      - name: Upload verified native package
        if: success()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0 (Node.js 24)
        with:
          name: kor-nexus-arch-package-${{ github.sha }}
          path: project/*.pkg.tar.*
          if-no-files-found: error
          retention-days: 30
