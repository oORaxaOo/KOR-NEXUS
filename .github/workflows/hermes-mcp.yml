name: Hermes MCP Integration Gate

on:
  push:
    branches: ["transfer/**"]
    paths:
      - "integrations/hermes/**"
      - "integrations/__init__.py"
      - "tests/test_hermes_plugin_contract.py"
      - ".github/workflows/hermes-mcp.yml"
  pull_request:
    paths:
      - "integrations/hermes/**"
      - "integrations/__init__.py"
      - "tests/test_hermes_mcp_client.py"
      - "tests/test_hermes_plugin_contract.py"
      - ".github/workflows/hermes-mcp.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hermes-mcp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hermes-mcp:
    name: Read-only KOR-NEXUS MCP adapter
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 (Node.js 24)

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0 (Node.js 24)
        with:
          python-version: "3.12"

      - name: Install optional MCP SDK
        run: python -m pip install --disable-pip-version-check -r integrations/hermes/requirements.txt

      - name: Check Python syntax and shell setup
        run: |
          python -m py_compile integrations/hermes/kor_client.py integrations/hermes/mcp_server.py integrations/hermes/doctor.py tests/test_hermes_mcp_client.py integrations/hermes/tests/test_mcp_server.py integrations/hermes/plugin/adapter.py
          bash -n integrations/hermes/setup.sh

      - name: Test loopback client restrictions and data access
        run: python -m unittest -v tests.test_hermes_mcp_client

      - name: Check Hermes platform adapter contract
        run: python -m unittest -v tests.test_hermes_plugin_contract

      - name: Test MCP protocol registration and tool calls
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s integrations/hermes/tests -v
