name: One-time KOR-NEXUS transfer and cleanup

on:
  push:
    branches:
      - "transfer/kor-nexus-1.20.0"
    paths:
      - ".github/workflows/repository-transfer.yml"

permissions:
  contents: write

concurrency:
  group: kor-nexus-one-time-transfer
  cancel-in-progress: false

jobs:
  verify-transfer:
    if: ${{ hashFiles('.github/workflows/repository-transfer.yml') != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout transfer branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recover and verify the exact 1.20.0 file set
        id: recover
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, os, tarfile, zipfile
          from pathlib import Path, PurePosixPath

          ROOT = Path.cwd()
          STAGE = Path("/tmp/kor-nexus-exact-transfer")
          STAGE.mkdir(parents=True, exist_ok=True)
          EXPECTED = {
            ".github/workflows/release.yml":"312dd70c1bc4faa9e2ef9a76d8b1bf04c780fa246a4e2d33bc1aa84c0278e87d",
            "CHANGELOG.md":"8f80ec99b4227a568ad23bb9570cee3aaa9d210a0f41bbed03f3ae40a625e754",
            "CI_MANUAL_START.md":"5ec1bea7b5835f22438260aa30c0ecff204e6aecfb62f03445e90cf0f3b0c952",
            "DECISIONS.md":"c2ebc4f3bd5ca95fc3b35f2695399cca2bdb080b491ff80ef8c0945c79a307cb",
            "EXPORT_SCHEMA.md":"b72da1da72ed5c57686379da18f4025c805955083b9bc315bd3234105135d7e3",
            "LICENSE":"becb6928de544d7c9a7340dbb16b186f2f2b400461d52691ed706e50baada428",
            "PKGBUILD":"bef68355bd402dfd014f9696a971ee643c84ca0867ebf067eabb8c11be1b9612",
            "PROJECT_STATUS.md":"dbb95bc350076d51093d874accbeb86afc2f222d0ecd915c39f9f1c96cb8abc1",
            "README.md":"9457bd1b82b2c2aca0184eaad1ddd91dcb9dc6d9956149a502c6f9e6b6153ffb",
            "core/__init__.py":"4ed55f963a7cae81faa244616863aeb38a4cd1f7c9847bae3826f8ddcb37f3b7",
            "core/server.py":"15bb11f32148c564c793c6288af34ef46eb8fff03b03e56a1921b1791d57df51",
            "core/test_server.py":"fe0eecd5277ef7e5b9fcfead8a1c99748dcf4d4ec9a86b5b0acad49a164e9a74",
            "install-user.sh":"028184a6299dc69c01ba5104527bd141a3affad238999cd1f130870000bb4b83",
            "launch.sh":"cd4f502ec65bf2e56b0e66711b8bbd0fe59786716229a27d175a1300b7e4e624",
            "packaging/icons/kor-workstation.svg":"a5b26457c203b2216a3c771aa757c84f9944bf70d2052c9cb2dd6e20fc1dd7d3",
            "packaging/kor-workstation-launcher.sh":"21aa5ae90c5b1f2760f36fe08adb813280aa950f98d3026966eb43dd1cd02533",
            "packaging/kor-workstation-stop.sh":"a834d8bbfe1eda86bd7b96a84b6dda052367910e121846bb808f7a9f92501d07",
            "packaging/kor-workstation.desktop":"58606eef18447444c237878777b9784c43b51d56de1f0a5b114a8e57239d701a",
            "preview/hud-redesign-desktop.png":"0fbe7eee388ade231d8ab1d288b4e8ef4ffca5e112260d73359d4fa9cce9f06a",
            "preview/hud-redesign-mobile.png":"fb3d274b7235e3dcf62a98d8f43ecdcd322e8a9c9797b73051f342cdf68d3f7e",
            "preview/smoke-test.png":"0fbe7eee388ade231d8ab1d288b4e8ef4ffca5e112260d73359d4fa9cce9f06a",
            "scripts/build-arch-package.sh":"9e247b6c7a16f314262b0a520c9b0dd6a3143677e0c87df73ce3d6f7299709e4",
            "scripts/ci.sh":"862578f4cf2704849af9924928f337202d51556ab6d98434d87fde4c19bfe906",
            "scripts/create-source-archive.py":"264a18b754e170d5468dd6794bcaa67e1e6cb183306a98a10c145748fc081441",
            "scripts/qa-preview-playwright.py":"6f6afd4dcb29a78dc3dab5d480a1829987ba99a997ac35e4502dcb33f084bc8a",
            "scripts/release-check.sh":"93b630aa1d078e3e640c708534c5f02e536d15f068913bc5726fda0889e2e6ea",
            "scripts/test-built-package-installation.sh":"6b8378d4468e3a86532b8125e2164ed29c3b4db48584adfe5acb8c6628393654",
            "scripts/test-installation.sh":"f8ed7683cf19cc384af75eb96a86b81a3affad238999cd1f130870000bb4b83",
            "scripts/verify-built-package.py":"200a7f4afef9e1cd26a82daf0c90e75b517bb8134ea01e8d0cb48e9801a56662",
            "scripts/verify-source.sh":"f91869dbe31d2f78e9fcd2da1fb856d49c5fd70e39012eb4e8ed71eaf0f723a0",
            "stop.sh":"7f43bbe19f0481916e79620dcaab85762195c921d654ce5145c91180ce5c53ec",
            "uninstall-user.sh":"c56e702be6878b4af512ba718982ff02fed43bcc462d901c269531acb8bbc8ac",
            "web/app.js":"d7af5914637502053418c5118a585cd496347a110777968779d96ed215b85969",
            "web/geodata/world.geojson":"8cde92ef2b36f541578c34947081fdb387677f8371134c6b49c11e9fc9e15f6d",
            "web/index.html":"5b61840cb95deab31985cf25fbbed7a7a9c65fb97010779d8f8ac0fcd79e0a4c",
            "web/styles.css":"b3819a8d023b3a5209c6f68474bbe7c1cac26de632ecca283b6497b9c9145274",
          }
          found = {name: None for name in EXPECTED}
          archive_report = []

          def clean_name(raw):
              parts = [p for p in PurePosixPath(raw.replace("\\", "/")).parts if p not in ("", ".", "/")]
              if not parts or any(p == ".." for p in parts):
                  return None
              return parts

          def consider_archive(path, kind):
              if not path.exists():
                  archive_report.append(f"{path.name}: not present")
                  return
              try:
                  if kind == "zip":
                      with zipfile.ZipFile(path) as z:
                          members = [(i.filename, z.read(i)) for i in z.infolist() if not i.is_dir()]
                  else:
                      with tarfile.open(path, "r:gz") as t:
                          members = [(m.name, t.extractfile(m).read()) for m in t.getmembers() if m.isfile()]
                  root_prefix = None
                  for name, _ in members:
                      parts = clean_name(name)
                      if parts:
                          for i in range(len(parts)-1):
                              if parts[i:i+2] == ["core", "server.py"]:
                                  root_prefix = parts[:i]
                                  break
                      if root_prefix is not None:
                          break
                  if root_prefix is None:
                      archive_report.append(f"{path.name}: no recognizable project root")
                      return
                  collected = {}
                  for name, data in members:
                      parts = clean_name(name)
                      if not parts or parts[:len(root_prefix)] != root_prefix:
                          continue
                      rel = "/".join(parts[len(root_prefix):])
                      if rel in EXPECTED:
                          collected[rel] = data
                  exact, mismatch = [], []
                  for rel, data in collected.items():
                      if hashlib.sha256(data).hexdigest() == EXPECTED[rel]:
                          exact.append(rel)
                          if found[rel] is None:
                              found[rel] = data
                      else:
                          mismatch.append(rel)
                  archive_report.append(f"{path.name}: {len(exact)}/{len(EXPECTED)} exact; {len(mismatch)} different")
              except Exception as exc:
                  archive_report.append(f"{path.name}: read error {type(exc).__name__}: {exc}")

          consider_archive(ROOT / "KOR_NEXUS_1.20.0_decision41_simulation.zip", "zip")
          consider_archive(ROOT / "KOR_NEXUS_1.20.0_repository_sync_prep.zip", "zip")
          consider_archive(ROOT / "KOR_NEXUS_1.20.0_source.tar.gz", "tar")

          missing = sorted(name for name, data in found.items() if data is None)
          report = [
              "# Transfer audit - KOR-NEXUS 1.20.0",
              "",
              "Reference ZIP SHA-256: 535499d9ff851dec75afaf8f61a51567c81656459888306c9a12346ee04e6188",
              "",
              "## Archive scan",
              *[f"- {line}" for line in archive_report],
              "",
              f"Exact files recovered: {len(EXPECTED)-len(missing)}/{len(EXPECTED)}.",
              "",
              "## Missing exact files",
              *([f"- {name}" for name in missing] or ["- none"]),
              "",
              "No archive content is executed before its bytes match the reference SHA-256."
          ]
          print("\n".join(report))
          if missing:
              (ROOT / "TRANSFER_AUDIT_REPORT.md").write_text("\n".join(report) + "\n", encoding="utf-8")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
                  out.write("recovered=false\n")
              raise SystemExit(0)

          for rel, data in found.items():
              dest = STAGE / rel
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(data)
          geo = STAGE / "web/geodata/world.geojson"
          assert hashlib.sha256(geo.read_bytes()).hexdigest() == EXPECTED["web/geodata/world.geojson"]
          print(f"STAGED_EXACT_FILES={len(found)}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("recovered=true\n")
          PY

      - name: Report incomplete archive recovery
        if: steps.recover.outputs.recovered == 'false'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TRANSFER_AUDIT_REPORT.md
          git commit -m "docs: report exact-version archive transfer audit"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Install exact recovered project and organize old uploads
        if: steps.recover.outputs.recovered == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import shutil
          stage = Path("/tmp/kor-nexus-exact-transfer")
          root = Path.cwd()
          executable = {
            "install-user.sh", "launch.sh", "stop.sh", "uninstall-user.sh",
            "packaging/kor-workstation-launcher.sh", "packaging/kor-workstation-stop.sh",
            "scripts/build-arch-package.sh", "scripts/ci.sh", "scripts/create-source-archive.py",
            "scripts/qa-preview-playwright.py", "scripts/release-check.sh",
            "scripts/test-built-package-installation.sh", "scripts/test-installation.sh",
            "scripts/verify-built-package.py", "scripts/verify-source.sh",
          }
          for rel in sorted(p for p in stage.rglob("*") if p.is_file()):
              name = rel.relative_to(stage).as_posix()
              dest = root / name
              dest.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(rel, dest)
              dest.chmod(0o755 if name in executable else 0o644)
          PY
          mkdir -p archive/legacy-uploads
          for f in KOR_NEXUS_1.20.0_decision41_simulation.zip KOR_NEXUS_1.20.0_repository_sync_prep.zip KOR_NEXUS_1.20.0_source.tar.gz; do
            if [[ -f "$f" ]]; then git mv "$f" archive/legacy-uploads/; fi
          done
          cat > archive/legacy-uploads/README.md <<'EOF'
          # Archived transfer inputs

          These original uploads are preserved for provenance and recovery.
          The supported source of truth is the project tree at the repository root,
          not the binary archives in this folder.
          EOF
          rm -f transfer-kor-nexus-1.20.0.sh TRANSFER_WRITE_TEST_2026-10-16.txt TRANSFER_AUDIT_REPORT.md
          cat > .gitignore <<'EOF'
          # Python caches and virtual environments
          __pycache__/
          *.py[cod]
          .venv/
          venv/

          # Frontend/build outputs
          node_modules/
          dist/
          build/
          *.pkg.tar.*
          kor-workstation-*.tar.gz
          SOURCE_SHA256SUMS.txt

          # Runtime/user data - never commit
          *.sqlite3
          *.sqlite3-*
          *.db
          *.log
          backups/
          .env
          .env.*
          !.env.example
          EOF
          python - <<'PY'
          from pathlib import Path
          p=Path(".github/workflows/release.yml")
          s=p.read_text(encoding="utf-8")
          s=s.replace("branches: [main, master]", 'branches: [main, master, "transfer/**"]')
          s=s.replace("          printf 'builder ALL=(ALL:ALL) NOPASSWD: ALL\\n' > /etc/sudoers.d/ci-builder\n          chmod 0440 /etc/sudoers.d/ci-builder\n", "")
          if "NOPASSWD: ALL" in s:
              raise SystemExit("Unrestricted sudo rule remains in release workflow")
          p.write_text(s, encoding="utf-8")
          PY
          rm -f .github/workflows/repository-transfer.yml
          python -m compileall -q core scripts
          python -m unittest -v core.test_server
          bash scripts/ci.sh quick
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          p=Path("web/geodata/world.geojson")
          assert hashlib.sha256(p.read_bytes()).hexdigest()=="8cde92ef2b36f541578c34947081fdb387677f8371134c6b49c11e9fc9e15f6d"
          data=json.loads(p.read_text(encoding="utf-8"))
          assert len(data["features"])==177
          print("PASS: offline world GeoJSON has 177 features and verified SHA-256")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git status --short
          git commit -m "chore: restore and organize KOR-NEXUS 1.20.0 source"
          git push origin "HEAD:${GITHUB_REF_NAME}"
