name: kor-nexus-platform
label: KOR-NEXUS
kind: platform
version: 0.1.0
description: >
  Local KOR-NEXUS command-center channel for Hermes Agent.
  Messages from the KOR-NEXUS HUD are securely relayed into the Hermes gateway,
  and assistant replies are written back into the local conversation history.
author: KOR-NEXUS
requires_env:
  - name: KOR_NEXUS_BRIDGE_TOKEN
    description: "Private bearer token generated by the KOR-NEXUS setup script"
    prompt: "KOR-NEXUS bridge token"
    password: true
optional_env:
  - name: KOR_NEXUS_DATA_HOME
    description: "KOR-NEXUS user data directory (normally detected automatically)"
    prompt: "KOR-NEXUS data directory"
    password: false
  - name: KOR_NEXUS_BRIDGE_URL
    description: "Optional explicit loopback URL; normally derived from runtime.json"
    prompt: "KOR-NEXUS local URL (optional)"
    password: false
  - name: KOR_NEXUS_HOME_CHANNEL
    description: "Conversation used for cron and notification delivery"
    prompt: "Default conversation"
    password: false
